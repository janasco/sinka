# Sinka (sinks): Gmail inbox replicator at the edge.
# No tunnel, no LAN box. Worker fronts sinka.example.com,
# singleton container runs the existing IMAP poller (src/index.js :8788),
# D1 replaces data/seen.json.
name = "sinka"
main = "worker.js"
compatibility_date = "2026-09-22"
workers_dev = false

# Serve sinka.example.com from the Worker.
# After first deploy, add this route in Dashboard or via API:
#   pattern sinka.example.com/* -> script sinka
# Keep the Cloudflare Access Email OTP app on this hostname (unchanged).

[[containers]]
class_name = "ReplicatorContainer"
image = "./Dockerfile"
max_instances = 1

[[durable_objects.bindings]]
class_name = "ReplicatorContainer"
name = "REPLICATOR"

[[migrations]]
new_sqlite_classes = ["ReplicatorContainer"]
tag = "v1"

# Plain (non-secret) config. Anything identifying (inbox lists, account
# and database IDs) goes via `wrangler secret put ...` instead:
# GMAIL_USER, GMAIL_APP_PASSWORD, DEST_SINKS, FORWARD_LIST,
# CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID, CLOUDFLARE_API_TOKEN, ADMIN_TOKEN.
[vars]
POLL_INTERVAL_MS = "300000"
LOOKBACK_HOURS = "24"
PORT = "8788"
DATA_DIR = "./data"
DRY_RUN = "0"

# NOTE: no [[d1_databases]] binding on purpose — the container reaches D1
# over the REST API (src/store_d1.js) using the secret IDs above, so the
# Worker needs no D1 binding and deploys stay free of real identifiers.

# Cron wakes the singleton for a poll (matches POLL_INTERVAL_MS=300000).
[triggers]
crons = ["*/5 * * * *"]
